name: Sales ETL CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run Bronze Tests
        run: |
          python -m pytest tests/test_bronze.py -v

      - name: Run Silver Validator Tests
        run: |
          python -m pytest tests/test_silver_validator.py -v

      - name: Run Silver Cleaning Tests
        run: |
          python -m pytest tests/test_silver_cleaning.py -v

      - name: Run Sales Gold Tests
        run: |
          python -m pytest tests/test_sales_gold.py -v

      - name: Run Customer Gold Tests
        run: |
          python -m pytest tests/test_customer_gold.py -v